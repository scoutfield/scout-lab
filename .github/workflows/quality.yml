name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension structure
        run: npm run check

      - name: Run tests and coverage gate
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  desktop-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - name: Check desktop browser behavior and encrypted credential transfer
        run: npm run test:e2e
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
